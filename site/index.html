<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07162b"><title>PROGNOZ AI</title>
<style>
:root{color-scheme:dark;--bg:#061525;--panel:#0c2540;--edge:#244866;--muted:#a3bad1;--accent:#50b6ff;--green:#30d7a3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#13375b,#061525 62%);color:#f4f8ff;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--accent)}
.wrap{max-width:520px;margin:auto;padding:16px 14px 96px;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:25px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--accent)}.season{font-size:12px;color:var(--muted)}.count{border:1px solid #286397;border-radius:18px;background:linear-gradient(140deg,#153f70,#0b2845);padding:14px 18px;margin-bottom:17px;display:flex;align-items:center;justify-content:space-between}.count strong{font-size:33px}.count span{color:#bfdbf4;font-size:13px}.filters,.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:11px;scrollbar-width:none}.pill{white-space:nowrap;border:1px solid #41688b;border-radius:30px;padding:8px 13px;background:#0e2c4b;font-size:13px;font-weight:700}.pill.active{background:#f2f8ff;color:#0c2948;border-color:#f2f8ff}.section-title{font-size:19px;margin:10px 0 12px}.match{position:relative;background:linear-gradient(145deg,#102e50,#0b233f);border:1px solid #27547c;border-radius:17px;padding:14px 12px;margin-bottom:13px;box-shadow:0 4px 20px #0002}.match-main{border:0;background:none;text-align:center;width:100%;padding:4px 4px 10px}.date{font-size:12px;color:#bbd4ed;margin-bottom:12px;padding:0 22px}.versus{display:grid;grid-template-columns:minmax(0,1fr) 94px minmax(0,1fr);align-items:center;gap:4px}.team{font-weight:800;font-size:14px;line-height:1.2;overflow-wrap:anywhere}.crest{display:block;width:48px;height:48px;object-fit:contain;margin:0 auto 7px}.fallback{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 7px;border-radius:50%;background:#235480;color:#fff;font-size:20px}.score{font-size:32px;font-weight:900;white-space:nowrap}.xscore{font-size:12px;color:#bfcee0}.xscore b{color:#7dd0ff}.cross{position:absolute;top:10px;right:10px;width:27px;height:27px;border-radius:50%;border:1px solid #ff7b8d;background:#bd293e;font-size:19px;font-weight:900;line-height:1;z-index:2}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.three span{background:#0c2038;border:1px solid #284b6c;border-radius:9px;padding:7px 1px;font-size:12px}.card{background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:16px;margin:12px 0}.back{border:1px solid #386792;background:#143b60;border-radius:10px;padding:8px 13px}.copy{white-space:pre-wrap;line-height:1.7;overflow-wrap:anywhere}.calc{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}.calc td,.calc th{border-bottom:1px solid #35506b;padding:10px 3px;text-align:center;overflow-wrap:anywhere}.calc th:nth-child(2){width:32%}.sub{font-size:12px;color:var(--muted)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:flex;background:#09243e;border:1px solid #285276;border-radius:15px 15px 0 0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}.bottom button{flex:1;border:0;background:transparent;padding:9px;font-weight:800;border-radius:10px}.bottom button.active{background:#11518a}.restore{font-size:13px;color:#9bd5ff}.restore button{background:#124b7c;border:1px solid #3e7db0;border-radius:8px;padding:5px 9px}.muted{color:var(--muted)}.error{color:#ffcf82}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#113354;border:1px solid #315e80;border-radius:12px;padding:18px;text-align:center}.stat strong{font-size:29px;display:block}
</style></head><body><main class="wrap" id="app"></main><nav class="bottom" id="bottom"></nav>
<script>
(function(){
'use strict';
const URL='https://raw.githubusercontent.com/artdm1912-prog/PrognozEPL/main/predictions.json';
const leagues=['Все','АПЛ','Серия А','Ла Лига','Бундеслига','РПЛ'];
const aliases={'халл':'халл сити','hull':'hull city','ньюкасл юнайтед':'ньюкасл','интер милан':'интер'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalizeName=x=>{let s=String(x||'').toLowerCase().replace(/[«».,]/g,'').replace(/\s+/g,' ').trim();return aliases[s]||s};
const key=m=>[String(m.date||'').slice(0,10),m.league,normalizeName(m.home),normalizeName(m.away)].join('|');
const hiddenKey='prognoz_ai_hidden_match_keys_v2';
const resultKey='progn_ai_results_v4';
function read(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch{return def}}
const state={page:'matches',league:'Все',tab:'Прогноз',open:null};
let matches=[], hidden=new Set(read(hiddenKey,[])), results=read(resultKey,{});
const crest=(name,url)=>{const src=/^https:\/\//.test(String(url||''))?url:'';const fallback='<span class="fallback">⚽</span>';return src?'<img class="crest" alt="Эмблема '+esc(name)+'" src="'+esc(src)+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'fallback\',textContent:\'⚽\'}))">':fallback};
const when=m=>{try{return new Date(m.date).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'})+' МСК'}catch{return m.date}};
const score=x=>Number.isFinite(Number(x))?Number(x).toFixed(2).replace('.',','):'—';
const label=m=>esc(m.home)+' — '+esc(m.away);
function card(m){const k=key(m);return '<article class="match"><button class="cross" data-hide="'+esc(k)+'" aria-label="Убрать матч">×</button><button class="match-main" data-open="'+esc(k)+'"><div class="date">'+esc(m.league)+' · '+esc(when(m))+'</div><div class="versus"><div>'+crest(m.home,m.homeCrest)+'<div class="team">'+esc(m.home)+'</div></div><div><div class="score">'+esc(m.predictedScore||'—')+'</div><div class="xscore">xScore <b>'+score(m.xScoreHome)+' : '+score(m.xScoreAway)+'</b></div></div><div>'+crest(m.away,m.awayCrest)+'<div class="team">'+esc(m.away)+'</div></div></div></button><div class="three"><span>Прогноз</span><span>5 факторов</span><span>2 ставки</span></div></article>'}
function details(m){const a=m.analysis||{};let content='';if(state.tab==='Расчёт'){const rows=Array.isArray(m.factors)?m.factors:[];content=rows.length?'<table class="calc"><thead><tr><th>'+esc(m.home)+'</th><th>Фактор</th><th>'+esc(m.away)+'</th><th>Вывод</th></tr></thead><tbody>'+rows.map(f=>'<tr><td>'+esc(f[2])+'</td><td><b>'+esc(f[0])+'</b><div class="sub">'+esc(f[1])+'%</div></td><td>'+esc(f[4])+'</td><td>'+esc(f[6]||'—')+'</td></tr>').join('')+'</tbody></table>':'<p class="error">Проверенная таблица расчёта пока не опубликована.</p>';if(m.calculation?.caveat)content+='<p class="sub">'+esc(m.calculation.caveat)+'</p>'}else{const prop={'Прогноз':'forecast','Форма':'form','Составы':'lineups','Ставки':'bets','LIVE':'live'}[state.tab];content='<div class="copy">'+esc(a[prop]||'Разбор ещё не опубликован.')+'</div>'}return '<button class="back" data-back="1">← К матчам</button><div class="match" style="margin-top:12px">'+card(m).replace('<article class="match">','<div>').replace('</article>','</div>')+'</div><div class="tabs">'+['Прогноз','Расчёт','Форма','Составы','Ставки','LIVE'].map(t=>'<button class="pill '+(state.tab===t?'active':'')+'" data-tab="'+t+'">'+t+'</button>').join('')+'</div><section class="card">'+content+'</section>'}
function render(){const visible=matches.filter(m=>(state.league==='Все'||state.league===m.league)&&!hidden.has(key(m)));const current=matches.find(m=>key(m)===state.open);let body='';if(state.page==='stats'){const vals=Object.values(results);body='<h2 class="section-title">Статистика ставок</h2><div class="stats"><div class="stat"><strong>'+vals.filter(v=>v==='win').length+'</strong>Зашло</div><div class="stat"><strong>'+vals.filter(v=>v==='loss').length+'</strong>Не зашло</div></div><p class="sub">Отметки о результатах сохранены на этом устройстве.</p>'}else if(current){body=details(current)}else{const hiddenItems=matches.filter(m=>hidden.has(key(m)));body='<div class="count"><span>Опубликовано прогнозов</span><strong>'+visible.length+'</strong></div><div class="filters">'+leagues.map(l=>'<button class="pill '+(state.league===l?'active':'')+'" data-league="'+esc(l)+'">'+esc(l)+'</button>').join('')+'</div><h2 class="section-title">Матчи и прогнозы</h2>'+(visible.map(card).join('')||'<div class="card muted">В этой лиге прогнозов пока нет.</div>')+(hiddenItems.length?'<details class="card restore"><summary>Скрытые матчи ('+hiddenItems.length+')</summary>'+hiddenItems.map(m=>'<p>'+label(m)+' <button data-restore="'+esc(key(m))+'">Вернуть</button></p>').join('')+'</details>':'')}document.getElementById('app').innerHTML='<header class="top"><div class="brand">PROGNOZ <span>AI</span></div><div class="season">2026/27</div></header>'+body+'<p class="sub" style="text-align:center;margin-top:14px">Прогнозы автоматически загружаются из GitHub.</p>';document.getElementById('bottom').innerHTML='<button data-page="matches" class="'+(state.page==='matches'?'active':'')+'">⚽ Матчи</button><button data-page="stats" class="'+(state.page==='stats'?'active':'')+'">▥ Статистика</button>'}
function apply(raw){const arr=Array.isArray(raw)?raw:raw?.matches;if(!Array.isArray(arr))return;const map=new Map();for(const m of arr){if(!m||!m.id||!m.league||!m.home||!m.away||!m.date)continue;map.set(key(m),m)}matches=[...map.values()].sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(state.open&&!matches.some(m=>key(m)===state.open))state.open=null;render()}
async function sync(){try{const response=await fetch(URL+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const json=await response.json();apply(json);localStorage.setItem('prognoz_cached_feed_v2',JSON.stringify(json))}catch(e){const cache=read('prognoz_cached_feed_v2',null);if(cache)apply(cache);else document.getElementById('app').innerHTML='<p class="card error">Не удалось загрузить прогнозы. Проверьте интернет.</p>'}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.hide){const m=matches.find(x=>key(x)===d.hide);if(m&&confirm('Убрать матч '+m.home+' — '+m.away+' на этом устройстве?')){hidden.add(d.hide);localStorage.setItem(hiddenKey,JSON.stringify([...hidden]));state.open=null;render()}}else if(d.restore){hidden.delete(d.restore);localStorage.setItem(hiddenKey,JSON.stringify([...hidden]));render()}else if(d.open){state.open=d.open;state.tab='Прогноз';render()}else if(d.back){state.open=null;render()}else if(d.tab){state.tab=d.tab;render()}else if(d.league){state.league=d.league;render()}else if(d.page){state.page=d.page;state.open=null;render()}});
window.addEventListener('pageshow',sync);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});sync();
})();
</script></body></html>
