/* Одинаковая ширина на компьютере и телефоне: телефонный макет по центру */
#app{width:100%;max-width:430px;margin:0 auto;padding:max(6px,env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom))}
.nav{width:100%;max-width:430px;left:50%;right:auto;transform:translateX(-50%)}
.brand{font-size:clamp(24px,6vw,29px)}
.team{font-size:clamp(14px,3.8vw,18px)}
.bigscore{font-size:clamp(35px,10vw,46px)}
.detailhero .bigscore{font-size:46px}
.detailhero .team{font-size:17px}
.calc{min-width:0;font-size:12px;table-layout:fixed}
.calc th,.calc td{padding:10px 2px;overflow-wrap:anywhere}
.calc th{font-size:12px}
.calc th:nth-child(1),.calc td:nth-child(1){width:24%}
.calc th:nth-child(2),.calc td:nth-child(2){width:32%}
.calc th:nth-child(3),.calc td:nth-child(3){width:24%}
.calc th:nth-child(4),.calc td:nth-child(4){width:20%}
.pane{font-size:16px}

function clubLogo(name,klass='club-logo',optionalUrl){
 const candidates=[EMBEDDED_CRESTS[name],VERIFIED_LOGOS[name],optionalUrl,CLUB_CRESTS[name]].filter(url=>/^(https:\/\/|data:image\/png;base64,)/.test(String(url||'')));
 const unique=[...new Set(candidates)];
 if(!unique.length)return '<span class="crest-unavailable" title="Эмблема не найдена">⚽</span>';
 // When the image server is inaccessible, try the next real crest. Never replace crests with letter avatars.
 return `<img class="${escapeHtml(klass)}" src="${escapeHtml(unique[0])}" data-sources="${escapeHtml(JSON.stringify(unique))}" data-i="0" alt="Эмблема ${escapeHtml(name)}" loading="eager" decoding="async" onerror="let list=JSON.parse(this.dataset.sources),i=+this.dataset.i+1;this.dataset.i=i;if(i<list.length)this.src=list[i];else{this.onerror=null;this.style.visibility='hidden';this.title='Эмблема недоступна';}">`;
}
function renderTeamForm(name,part){
 const raw=String(part||'').trim();
 const url=(name===window.__formGame?.home?window.__formGame.homeCrest:window.__formGame?.awayCrest);
 const logo=clubLogo(name,'form-team-logo',url);
 // Exactly five standalone form letters, not letters from team names or words.
 const seq=raw.match(/(?<![А-Яа-яA-Za-z])([ВНП](?:\s*[•·,.;]\s*[ВНП]){4})(?![А-Яа-яA-Za-z])/u);
 const badges=seq?[...seq[1].matchAll(/[ВНП]/g)].map(m=>`<span class="form-letter ${FORM_BADGE[m[0]]}">${m[0]}</span>`).join(''):'';
 let prose=seq?raw.replace(seq[1],''):raw;
 prose=prose.replace(/^\s*Последние\s*5\s*матчей\s*:\s*(?:[.\s]*)/i,'').replace(/^\s*[•:;.\-]+/,'').trim();
 return `<section class="form-team-card"><div class="form-team-heading">${logo}<h3>${escapeHtml(name)}</h3></div>${badges?`<div class="form-recent-label">Последние 5 матчей</div><div class="form-results">${badges}</div>`:''}<p class="analysis-text">${escapeHtml(prose)||'Дополнительных данных нет.'}</p></section>`;
}
function renderForm(g){
 window.__formGame=g;
 const raw=String(g.analysis?.form||g.form||'').replace(/\r\n/g,'\n').trim();
 if(!raw)return '<div class="form-subnote">Информация о форме пока не опубликована.</div>';
 // Match ONLY paragraph/line starts, never an opposing club referenced inside results.
 const names=[g.home,g.away];
 const heading=n=>n.toLocaleLowerCase('ru').replace(/\s+москва$/,'').trim();
 const pieces=raw.split(/\n\s*\n/);
 const parts=['','']; let current=-1;
 for(const piece of pieces){
  const lines=piece.split('\n');
  for(const line of lines){
   const m=line.match(/^\s*([^:\n—–]{2,45}?)\s*(?::|\s+[—–]\s+)\s*(.*)$/u);
   let next=-1,content=line;
   if(m){const candidate=heading(m[1]);next=names.findIndex(n=>heading(n)===candidate);if(next!==-1)content=m[2];}
   if(next!==-1)current=next;
   if(current!==-1)parts[current]+=(parts[current]?'\n':'')+content;
   else parts[0]+=(parts[0]?'\n':'')+line;
  }
 }
 // When both sections exist, show independent cards; otherwise show complete original.
 if(!parts[0]||!parts[1])return `<div class="analysis-text">${escapeHtml(raw)}</div>`;
 return names.map((n,i)=>renderTeamForm(n,parts[i])).join('')+'<div class="form-subnote">В — победа, Н — ничья, П — поражение.</div>';
}
