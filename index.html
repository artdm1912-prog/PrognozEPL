<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>АНАЛИЗ МАТЧА</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111e;
      --card-bg: #131d31;
      --card-border: #1f2d47;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #facc15;
      --purple: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Масштаб увеличен на 20% */
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 18px 14px 60px 14px;
      font-size: 17px;
      line-height: 1.45;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Блоки с возможностью сворачивания */
    .block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      cursor: pointer;
      user-select: none;
      background: rgba(255,255,255,0.02);
      transition: background 0.2s;
    }

    .block-header:hover {
      background: rgba(255,255,255,0.05);
    }

    .block-title {
      font-size: 18px;
      font-weight: 700;
      color: #60a5fa;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-arrow {
      font-size: 16px;
      color: var(--text-muted);
      transition: transform 0.3s ease;
    }

    .block.collapsed .toggle-arrow {
      transform: rotate(-90deg);
    }

    .block.collapsed .block-content {
      display: none;
    }

    .block-content {
      padding: 18px;
      border-top: 1px solid var(--card-border);
    }

    /* Формы и элементы ввода */
    label {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    select, input {
      width: 100%;
      background: #0b111e;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: #3b82f6;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .metrics-header {
      font-size: 15px;
      font-weight: 700;
      color: #e2e8f0;
      margin: 16px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-calc {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-calc:hover {
      background: var(--accent-hover);
    }

    .btn-calc:active {
      transform: scale(0.99);
    }

    /* Карточки счёта */
    .score-card {
      background: #0b111e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #3b82f6;
    }

    .score-card.highlight {
      border-left-color: var(--green);
    }

    .score-main {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .score-sub {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Карточки составов */
    .squad-card {
      background: #0b111e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      border-left: 4px solid var(--purple);
    }

    .squad-team {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .squad-section {
      font-size: 15px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .squad-section strong {
      color: #e2e8f0;
    }

    .tag-out {
      color: #f87171;
      font-weight: 600;
    }

    .tag-in {
      color: #4ade80;
      font-weight: 600;
    }

    .tag-impact {
      color: #facc15;
      font-weight: 600;
    }

    /* Value & Live */
    .badge-edge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: 700;
      margin-left: 6px;
    }

    .value-item {
      padding: 14px;
      background: #0b111e;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid var(--card-border);
    }

    .value-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .value-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .scenario-box {
      background: #0b111e;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border-left: 4px solid var(--yellow);
    }

    .scenario-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--yellow);
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>АНАЛИЗ МАТЧА</h1>
    <div class="subtitle">5-факторная модель Пуассона | Только матчи АПЛ 26/27</div>
  </header>

  <!-- БЛОК 1 -->
  <div class="block" id="block-1">
    <div class="block-header" onclick="toggleBlock('block-1')">
      <div class="block-title">1. Исходные данные и метрики тура</div>
      <div class="toggle-arrow">▼</div>
    </div>
    <div class="block-content">
      <label for="matchSelect">Выберите матч тура:</label>
      <select id="matchSelect" onchange="onMatchChange()">
        <option value="">Загрузка расписания матчей...</option>
      </select>

      <div class="grid-2" style="margin-top: 14px;">
        <div>
          <label>Хозяева</label>
          <input type="text" id="homeTeam" value="Арсенал">
        </div>
        <div>
          <label>Гости</label>
          <input type="text" id="awayTeam" value="Лидс Юнайтед">
        </div>
      </div>

      <div class="metrics-header">5 Метрик (Хозяева / Гости)</div>
      
      <div class="grid-2">
        <div>
          <label>xG Хозяев</label>
          <input type="number" step="0.05" id="home_xg" value="1.85">
        </div>
        <div>
          <label>xGA / xG Гостей</label>
          <input type="number" step="0.05" id="away_xg" value="0.85">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Створ ворот хозяев</label>
          <input type="number" step="0.1" id="home_sot" value="5.2">
        </div>
        <div>
          <label>Створ гостей</label>
          <input type="number" step="0.1" id="away_sot" value="2.6">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Реальные голы хозяев</label>
          <input type="number" step="0.1" id="home_goals" value="1.6">
        </div>
        <div>
          <label>Голы гостей</label>
          <input type="number" step="0.1" id="away_goals" value="0.8">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Все удары хозяев</label>
          <input type="number" step="0.1" id="home_sh" value="14.2">
        </div>
        <div>
          <label>Удары гостей</label>
          <input type="number" step="0.1" id="away_sh" value="8.4">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>Угловые хозяев</label>
          <input type="number" step="0.1" id="home_cr" value="5.8">
        </div>
        <div>
          <label>Угловые гостей</label>
          <input type="number" step="0.1" id="away_cr" value="3.2">
        </div>
      </div>
