<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5-Factor Poisson Analytical Model</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Шапка -->
    <header class="border-b border-slate-800 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-black tracking-tight text-white flex items-center gap-2">
          ⚽ Аналитический Движок Пуассона 2026/27
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Двухфакторная модель: (Атака × Защита соперника / Базис лиги)
        </p>
      </div>
      <div id="phase-badge" class="self-start md:self-auto px-3 py-1 bg-blue-950/80 border border-blue-500/40 text-blue-300 rounded-full text-xs font-semibold">
        Определение фазы...
      </div>
    </header>

    <!-- Панель управления (Выбор матча и лиги) -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700/60">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Турнир</label>
        <select id="league-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          <option value="EPL">Английская Премьер-лига (АПЛ)</option>
          <option value="SERIE_A">Итальянская Серия А</option>
          <option value="LA_LIGA">Испанская Ла Лига</option>
          <option value="BUNDESLIGA">Немецкая Бундеслига</option>
          <option value="RPL">Российская Премьер-лига (РПЛ)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Хозяева поля</label>
        <select id="home-team-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Гости</label>
        <select id="away-team-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
        </select>
      </div>
    </section>

    <!-- Карточка матча (Вердикт) -->
    <section id="match-header-card" class="bg-gradient-to-r from-slate-800 via-slate-800 to-slate-850 p-6 rounded-xl border border-slate-700">
      <!-- Рендерится через app.js -->
    </section>

    <!-- Сводная таблица действий -->
    <section>
      <h2 class="text-base font-bold text-slate-200 mb-3 flex items-center gap-2">
        📊 Сводный объём действий и моделирование счёта
      </h2>
      <div id="forecast-table-container">
        <!-- Таблица рендерится через app.js -->
      </div>
    </section>

    <!-- Блок кадровых поправок и контекста -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div id="home-injury-card" class="bg-slate-800/40 border border-slate-800 p-4 rounded-xl"></div>
      <div id="away-injury-card" class="bg-slate-800/40 border border-slate-800 p-4 rounded-xl"></div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
