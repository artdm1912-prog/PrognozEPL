name: Update Matches Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 4,6' # Thursday/Saturday 06:00 UTC

permissions:
  contents: write

concurrency:
  group: prognozepl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Update verified Premier League data
        env:
          FOOTBALLDATA_IO_KEY: ${{ secrets.FOOTBALLDATA_IO_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python update_data.py
      - name: Commit verified snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matches.json team_stats.json stats_match_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified PL fixture and stats caches'
            git push
          else
            echo 'No changes to commit'
          fi
