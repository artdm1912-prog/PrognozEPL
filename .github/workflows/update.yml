name: Update Matches Data

on:
  schedule:
    # Запуск каждый четверг и субботу в 06:00 UTC
    - cron: '0 6 * * 4,6'
  workflow_dispatch: # Возможность запустить вручную одной кнопкой

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python update_data.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add matches.json
          git commit -m "Auto-update match fixtures and predictions" || echo "No changes to commit"
          git push
