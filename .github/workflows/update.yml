name: Update Matches Data

on:
  workflow_dispatch:
  schedule:
    # Thursday and Saturday, 06:00 UTC (09:00 Moscow)
    - cron: '0 6 * * 4,6'

permissions:
  contents: write

concurrency:
  group: prognozepl-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Fetch verified Premier League fixtures
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python update_data.py
      - name: Commit verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matches.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update real PL fixtures (2026/27)'
            git push
          else
            echo 'No change to commit'
          fi
